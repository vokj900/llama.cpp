name: Build llama.cpp Windows CUDA for Maple

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows-cuda:
    runs-on: windows-latest
    steps:
      - name: Checkout deepgrove-ai/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: deepgrove-ai/llama.cpp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Install CUDA Toolkit
        run: |
          choco install cuda -y
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.0\bin" | Out-File -Append $env:GITHUB_PATH -Encoding utf8

      - name: Configure CMake
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_METAL=OFF `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=native `
            -G Ninja

      - name: Build
        run: cmake --build build --config Release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-windows-cuda
          path: build/bin/Release/*
