name: Build llama-server (Official Reference)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Clone deepgrove-ai/llama.cpp
        uses: actions/checkout@v6
        with:
          repository: deepgrove-ai/llama.cpp
          ref: main
          submodules: recursive

      - name: Install Ninja
        run: choco install ninja
        shell: cmd

      - name: Install CUDA Toolkit 12.4.1
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.4.1"
          method: "network"
          sub-packages: '["nvcc", "visual_studio_integration", "cudart", "cublas", "cublas_dev"]'

      - name: Build llama-server
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% -t llama-server

      - name: Collect artifacts
        run: |
          mkdir out
          copy build\bin\Release\llama-server.exe out\
          robocopy "%CUDA_PATH%\bin" out cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
        shell: cmd

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-cuda
          path: out\
          retention-days: 7
