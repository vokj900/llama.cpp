name: Build Maple Server for RTX 5060 Ti (Windows Native - All Fixed)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      actions: write

    steps:
      # ============================================================
      # 1. 拉取 deepgrove-ai/llama.cpp（Maple 官方源码）
      # ============================================================
      - name: Checkout deepgrove-ai/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: deepgrove-ai/llama.cpp
          ref: main
          submodules: recursive

      # ============================================================
      # 2. 安装 OpenSSL（提供静态链接所需的 .lib 文件）
      # ============================================================
      - name: Install OpenSSL
        run: choco install openssl -y
        shell: cmd

      # ============================================================
      # 3. 安装 CUDA Toolkit 12.8.1
      #    - use-github-cache: false  → 解决 3772776473 安装错误
      #    - 精简 sub-packages       → 避免 VS 集成组件冲突
      # ============================================================
      - name: Install CUDA Toolkit 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda-toolkit
        with:
          cuda: '12.8.1'
          method: 'network'
          use-github-cache: false
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      # ============================================================
      # 4. 安装 Ninja 编译工具
      # ============================================================
      - name: Install Ninja
        run: choco install ninja -y
        shell: cmd

      # ============================================================
      # 5. 编译 llama-server（核心修复全在这里）
      # ============================================================
      - name: Build llama-server for Blackwell sm_120
        id: cmake_build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            ^
            REM --- SSL 修复：关闭 BoringSSL，静态链接 OpenSSL ---
            -DLLAMA_BUILD_BORINGSSL=OFF ^
            -DOPENSSL_USE_STATIC_LIBS=ON ^
            -DOPENSSL_ROOT_DIR="C:\Program Files\OpenSSL-Win64" ^
            ^
            REM --- CURL 修复：静态链接，避免缺 libcurl.dll ---
            -DCURL_USE_STATIC_LIBS=ON ^
            -DBUILD_CURL_EXE=OFF ^
            ^
            REM --- CUDA / GGML 配置 ---
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DGGML_CUDA_FORCE_MMQ=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="120" ^
            ^
            REM --- 静态链接运行时，减少 dll 依赖 ---
            -DCMAKE_C_FLAGS="/MT" ^
            -DCMAKE_CXX_FLAGS="/MT"

          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% -t llama-server

      # ============================================================
      # 6. 收集产物（通配符匹配，确保所有依赖都被拷贝）
      # ============================================================
      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir out

          REM --- 核心程序 ---
          copy build\bin\Release\llama-server.exe out\

          REM --- GGML 全家桶（通配符匹配，不漏任何一个）---
          copy build\bin\Release\ggml*.dll out\

          REM --- Llama 全家桶 ---
          copy build\bin\Release\llama*.dll out\

          REM --- 多模态依赖 ---
          copy build\bin\Release\mtmd.dll out\

          REM --- CUDA 运行时（通配符适配版本号变化）---
          copy "%CUDA_PATH%\bin\cudart64_*.dll" out\
          copy "%CUDA_PATH%\bin\cublas64_*.dll" out\
          copy "%CUDA_PATH%\bin\cublasLt64_*.dll" out\

          REM --- VC++ 运行库兜底（防止用户电脑缺运行库）---
          copy "C:\Windows\System32\vcruntime140.dll" out\
          copy "C:\Windows\System32\vcruntime140_1.dll" out\
          copy "C:\Windows\System32\msvcp140.dll" out\
          copy "C:\Windows\System32\msvcp140_1.dll" out\
          copy "C:\Windows\System32\msvcp140_2.dll" out\
          copy "C:\Windows\System32\concrt140.dll" out\

          echo.
          echo === Final artifacts list ===
          dir out\
          exit /b 0

      # ============================================================
      # 7. 上传产物
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-maple-windows-cuda12.8-fixed
          path: out\
          retention-days: 7
