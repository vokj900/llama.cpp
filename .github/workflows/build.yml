name: Build llama-server (Windows CUDA - Optimized)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  build:
    runs-on: windows-2022
    permissions:
      actions: write

    steps:
      - name: Clone deepgrove-ai/llama.cpp
        uses: actions/checkout@v6
        with:
          repository: deepgrove-ai/llama.cpp
          ref: main
          submodules: recursive

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: windows-2022-x64-cuda-12.4

      - name: Install CUDA Toolkit 12.4
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: "12.4"

      - name: Install Ninja
        run: choco install ninja -y
        shell: cmd

      - name: Build llama-server
        id: cmake_build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_BORINGSSL=OFF ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="86;89"
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% -t llama-server

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir out
          copy build\bin\Release\llama-server.exe out\
          copy build\bin\Release\llama-server-impl.dll out\
          copy build\bin\Release\llama-common.dll out\
          copy build\bin\Release\ggml-cuda.dll out\
          copy build\bin\Release\ggml-base.dll out\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\cudart64_12.dll" out\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\cublas64_12.dll" out\
          copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin\cublasLt64_12.dll" out\
          echo === Final artifacts list ===
          dir out\
          exit /b 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-windows-cuda-12.4
          path: out\
          retention-days: 7
