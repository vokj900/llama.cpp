name: Build Maple Server for Blackwell (Ubuntu + CUDA 12.8)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.8.0-devel-ubuntu22.04

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git cmake ninja-build build-essential

      - name: Checkout deepgrove-ai/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: deepgrove-ai/llama.cpp
          submodules: recursive

      - name: Build llama-server for Blackwell sm_120
        run: |
          mkdir build
          cmake -S . -B build -G Ninja \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_BORINGSSL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_CUB_3DOT2=ON \
            -DGGML_CUDA_FORCE_MMQ=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="120"
          cmake --build build --config Release -j $(nproc) -t llama-server

      - name: Collect artifacts
        run: |
          mkdir out
          cp build/bin/llama-server out/
          cp build/bin/*.so* out/ || true
          cp build/bin/*.dll out/ || true
          cp build/bin/mtmd.dll out/ || true
          echo "=== Final artifacts list ==="
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-maple-rtx5060ti-linux
          path: out/
          retention-days: 7
