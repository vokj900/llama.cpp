name: Build Maple Server for Blackwell (Clean Fix)

# 触发条件：手动触发或推送 main 分支
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    # 1. 检出 llama.cpp 源码
    - name: Checkout llama.cpp
      uses: actions/checkout@v4
      with:
        repository: ggml-org/llama.cpp
        path: llama.cpp

    # 2. 拉取 Maple 官方分支
    - name: Add Maple remote
      working-directory: ./llama.cpp
      run: |
        git remote add maple https://github.com/deepgrove-ai/llama.cpp.git
        git fetch maple
        git checkout -b maple-deepgrove maple/deepgrove-ai
      shell: cmd

    # 3. 手动下载并静默安装 CUDA 13.3
    - name: Download and Install CUDA 13.3
      run: |
        curl -o cuda_installer.exe -L https://developer.download.nvidia.com/compute/cuda/13.3.0/local_installers/cuda_13.3.0_570.124.04_windows.exe
        cuda_installer.exe -s nvcc_13.3 cuobjdump_13.3 cublas_13.3 cublas_dev_13.3 cufft_13.3 cufft_dev_13.3 curand_13.3 curand_dev_13.3 cusolver_13.3 cusolver_dev_13.3 cusparse_13.3 cusparse_dev_13.3 nvrtc_13.3 nvrtc_dev_13.3 nvml_dev_13.3
        echo CUDA installed successfully.
      shell: cmd

    # 4. 安装 Ninja 编译工具
    - name: Install Ninja
      run: choco install ninja -y
      shell: cmd

    # 5. 编译适配 Blackwell (sm_120) 的 llama-server
    - name: Build llama-server for Blackwell sm_120
      id: cmake_build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        cd llama.cpp
        cmake -S . -B build -G "Ninja Multi-Config" ^
          -DLLAMA_BUILD_SERVER=ON ^
          -DLLAMA_CUDA=ON ^
          -DGGML_CUDA_ARCHITECTURES=120 ^
          -DGGML_CUDA_FORCE_MMQ=OFF
        cmake --build build --config Release --parallel
      env:
        CUDA_PATH: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3

    # 6. 收集产物
    - name: Collect artifacts
      shell: cmd
      run: |
        mkdir out
        copy llama.cpp\build\bin\Release\llama-server.exe out\
        copy llama.cpp\build\bin\Release\llama-*.dll out\
        copy llama.cpp\build\bin\Release\ggml-*.dll out\
        copy llama.cpp\build\bin\Release\mtmd.dll out\
        copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3\bin\cudart64_*.dll" out\
        copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3\bin\cublas64_*.dll" out\
        copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3\bin\cublasLt64_*.dll" out\
        echo === Final artifacts list ===
        dir out\
        exit /b 0

    # 7. 上传编译好的程序
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: llama-server-maple-blackwell
        path: out\
        retention-days: 7
