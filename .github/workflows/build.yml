name: Build Maple Server for RTX 5060 Ti (Windows Native)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      actions: write

    steps:
      - name: Checkout deepgrove-ai/llama.cpp
        uses: actions/checkout@v4
        with:
          repository: deepgrove-ai/llama.cpp
          ref: main
          submodules: recursive

      - name: Install CUDA Toolkit 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.11
        id: cuda-toolkit
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Install Ninja
        run: choco install ninja -y
        shell: cmd

      - name: Build llama-server for Blackwell sm_120
        id: cmake_build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_BORINGSSL=OFF ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON ^
            -DGGML_CUDA_FORCE_MMQ=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES="120"
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% -t llama-server

      - name: Collect artifacts
        shell: cmd
        run: |
          mkdir out
          copy build\bin\Release\llama-server.exe out\
          copy build\bin\Release\llama-*.dll out\
          copy build\bin\Release\ggml-*.dll out\
          copy build\bin\Release\mtmd.dll out\
          copy "${{steps.cuda-toolkit.outputs.CUDA_PATH}}\bin\cudart64_12.dll" out\
          copy "${{steps.cuda-toolkit.outputs.CUDA_PATH}}\bin\cublas64_12.dll" out\
          copy "${{steps.cuda-toolkit.outputs.CUDA_PATH}}\bin\cublasLt64_12.dll" out\
          echo === Final artifacts list ===
          dir out\
          exit /b 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-maple-windows-cuda12.8
          path: out\
          retention-days: 7
