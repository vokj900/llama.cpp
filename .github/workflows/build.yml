name: Build Maple Server for Blackwell (Fixed)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    # 1. 检出上游llama.cpp源码
    - name: Checkout llama.cpp
      uses: actions/checkout@v4
      with:
        repository: ggml-org/llama.cpp
        path: llama.cpp

    # 2. 拉取DeepGrove官方Maple分支（包含Maple架构实现）
    - name: Add Maple remote
      working-directory: ./llama.cpp
      run: |
        git remote add maple https://github.com/deepgrove-ai/llama.cpp.git
        git fetch maple
        git checkout -b maple-deepgrove maple/deepgrove-ai
      shell: cmd

    # 3. 安装CUDA 13.3（Blackwell sm_120必需版本）
    - name: Install CUDA Toolkit 13.3
      uses: actions/setup-cuda@v3
      with:
        cuda-version: "13.3"
        method: "network"
        driver: false

    # 4. 安装Ninja编译工具
    - name: Install Ninja
      run: choco install ninja -y
      shell: cmd

    # 5. 编译适配RTX 5060 Ti（sm_120）的llama-server
    - name: Build llama-server for Blackwell sm_120
      id: cmake_build
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        cd llama.cpp
        cmake -S . -B build -G "Ninja Multi-Config" ^
          -DLLAMA_BUILD_SERVER=ON ^
          -DLLAMA_CUDA=ON ^
          -DGGML_CUDA_ARCHITECTURES=120 ^
          -DGGML_CUDA_FORCE_MMQ=OFF
        cmake --build build --config Release --parallel
      env:
        CUDA_PATH: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3

    # 6. 收集全部运行依赖
    - name: Collect artifacts
      shell: cmd
      run: |
        mkdir out
        copy llama.cpp\build\bin\Release\llama-server.exe out\
        copy llama.cpp\build\bin\Release\llama-*.dll out\
        copy llama.cpp\build\bin\Release\ggml-*.dll out\
        copy llama.cpp\build\bin\Release\mtmd.dll out\
        copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3\bin\cudart64_*.dll" out\
        copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3\bin\cublas64_*.dll" out\
        copy "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3\bin\cublasLt64_*.dll" out\
        echo === Final artifacts list ===
        dir out\
        exit /b 0

    # 7. 上传编译产物
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: llama-server-maple-blackwell
        path: out\
        retention-days: 7
